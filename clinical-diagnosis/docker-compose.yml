version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATA_ROOT=/data
      - CORS_ORIGINS=http://localhost:3001
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://118.195.160.99/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./data:/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - BACKEND_URL=http://backend:8000
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://118.195.160.99/v1}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
    depends_on:
      - backend
